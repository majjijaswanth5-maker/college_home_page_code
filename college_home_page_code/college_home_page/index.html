<!DOCTYPE html>
<html>
<head>
<title>College Website</title>
<style>
body {font-family:Arial;}
header, footer {background:navy;color:white;text-align:center;padding:15px;}
nav {background:lightblue;padding:10px;}
.container {display:flex;gap:20px;}
table,td,th {border:1px solid black;padding:8px;}
@media(max-width:600px) {
  .container {flex-direction:column;}
}
</style>
</head>
<body>
<header>
<h1>ABC College</h1>
</header>
<nav>
<a href="#">Home</a> |
<a href="#">About</a> |
<a href="#">Courses</a> |
<a href="#">Contact</a>
</nav>
<div class="container">
<div>
<h2>Courses</h2>
<table>
<tr><th>Course</th><th>Years</th></tr>
<tr><td>CSE</td><td>4</td></tr>
<tr><td>ECE</td><td>4</td></tr>
</table>
</div>
<div>
<h2>Contact Form</h2>
<input type="text" placeholder="Name"><br><br>
<input type="email" placeholder="Email"><br><br>
<button>Submit</button>
</div>
</div>
<footer>Welcome to ABC College</footer>
</body>
</html>
